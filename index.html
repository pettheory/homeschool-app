<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Word Lab — Reading &amp; Spelling</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0c0820; overflow: hidden; }
  * { -webkit-font-smoothing: antialiased; }
  #stage-wrap { position: fixed; inset: 0; display: grid; place-items: center; background:
    radial-gradient(80% 70% at 50% 0%, #1a0f3a, #0c0820 70%); }
  #stage { width: 1280px; height: 800px; transform-origin: center; border-radius: 22px; overflow: hidden;
    box-shadow: 0 30px 120px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.06); position: relative; }
  #root { width: 100%; height: 100%; }
  #toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 999;
    background: rgba(20,12,40,.95); color: #fff; font-family: "Nunito", sans-serif; font-size: 14px;
    padding: 12px 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,.14); opacity: 0;
    transition: opacity .25s; pointer-events: none; max-width: 80vw; text-align: center; }
</style>
</head>
<body>
<div id="stage-wrap"><div id="stage"><div id="root"></div></div></div>
<div id="toast"></div>

<!-- stage scaling + real-mic bridge (DOM-bound; defines globals used by the React bundle) -->
<script>
  (function () {
    const stage = document.getElementById('stage');
    function fit() {
      const s = Math.min(window.innerWidth / 1280, window.innerHeight / 800);
      stage.style.transform = 'scale(' + s + ')';
    }
    window.addEventListener('resize', fit); fit();
  })();
  function toast(msg) {
    const t = document.getElementById('toast'); t.textContent = msg; t.style.opacity = 1;
    clearTimeout(t._h); t._h = setTimeout(() => (t.style.opacity = 0), 2600);
  }
  // ── Mic debug stream: every recognition event (interim/final/emit/restart/error)
  // is recorded to window.__micEvents and broadcast as a 'miclog' CustomEvent, so the
  // on-screen Mic Console (and DevTools) can show in real time what the mic heard vs
  // what letters were emitted. Ring-buffered; also mirrored to console.debug('[mic]').
  window.__micEvents = window.__micEvents || [];
  function micLog(kind, detail) {
    try {
      const evt = { t: Date.now(), kind, detail: String(detail) };
      window.__micEvents.push(evt);
      if (window.__micEvents.length > 400) window.__micEvents.splice(0, 200);
      console.debug('[mic]', kind, detail);
      window.dispatchEvent(new CustomEvent('miclog', { detail: evt }));
    } catch (e) {}
  }

  // Best-effort real ASR. Reading: one-shot -> cb(transcript, confidence).
  // Spelling: CONTINUOUS — stays hot across pauses by auto-restarting the recognizer
  // on `onend` (Chrome ends a session after a few seconds of silence). Returns a
  // controller { stop() } and stashes it on window.__micCtl so the screen can stop it.
  //
  // Letters are emitted from FINAL results only: interim text is unstable (it mutates
  // as the recognizer settles), and parsing it caused letters to appear late or wrong —
  // e.g. "B" popping up only after the child said "E". Final-only costs a short beat
  // (Chrome finalizes on a brief pause) but every letter lands once, correctly ordered.
  // Interim text still streams to the Mic Console for visibility.
  window.startRealMic = function (cb, isSpelling) {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { toast('Speech recognition needs Chrome. Use the demo chips to preview the flow.'); return null; }
    if (window.__micCtl) { try { window.__micCtl.stop(); } catch (e) {} } // only one mic at a time

    let active = true;   // false once stopped or fatally errored
    let emitted = 0;     // letters emitted from the CURRENT recognition session
    let startedAt = 0;   // when the current session started (ms)
    let quickFails = 0;  // consecutive near-instant ends → mic broken/denied
    const rec = new SR();
    rec.lang = 'en-US'; rec.interimResults = isSpelling; rec.continuous = isSpelling; rec.maxAlternatives = 1;

    function safeStart() {
      try { startedAt = Date.now(); rec.start(); }
      catch (e) { setTimeout(() => { if (active) { try { startedAt = Date.now(); rec.start(); } catch (e2) {} } }, 250); }
    }

    rec.onresult = function (e) {
      if (!isSpelling) {
        const r = e.results[0][0];
        micLog('final', `"${r.transcript}" (conf ${(r.confidence || 0).toFixed(2)})`);
        cb(r.transcript, r.confidence || 0.9);
        return;
      }
      quickFails = 0; // we're hearing audio
      let finalText = '', interimText = '';
      for (let i = 0; i < e.results.length; i++) {
        if (e.results[i].isFinal) finalText += e.results[i][0].transcript + ' ';
        else interimText += e.results[i][0].transcript + ' ';
      }
      if (interimText.trim()) micLog('interim', interimText.trim());
      const letters = window.PHON.parseLetters(finalText);
      if (finalText.trim()) micLog('final', `"${finalText.trim()}" → letters [${letters.join(' ')}]`);
      while (emitted < letters.length) { micLog('emit', letters[emitted]); cb(letters[emitted]); emitted++; }
    };
    rec.onerror = function (ev) {
      micLog('error', ev.error);
      if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') {
        active = false; toast('Mic permission blocked. Use the demo chips instead.');
      }
      // no-speech / aborted / network → let onend decide whether to restart
    };
    rec.onend = function () {
      // Reading is one-shot; spelling keeps the mic hot.
      if (!isSpelling || !active) { active = false; if (window.__micCtl === ctl) window.__micCtl = null; micLog('stop', 'mic off'); return; }
      // Bail out if the recognizer keeps dying instantly (broken/denied mic) instead of looping forever.
      if (Date.now() - startedAt < 500) {
        if (++quickFails >= 5) { active = false; toast('Mic keeps dropping — use the demo chips.'); if (window.__micCtl === ctl) window.__micCtl = null; micLog('stop', 'gave up (mic keeps dropping)'); return; }
      } else { quickFails = 0; }
      emitted = 0; // fresh session: results index resets, letters keep appending
      micLog('restart', 'recognizer session ended — restarting (mic stays hot)');
      safeStart();
    };

    const ctl = {
      stop() { active = false; try { rec.stop(); } catch (e) {} if (window.__micCtl === ctl) window.__micCtl = null; },
      get active() { return active; },
    };

    toast(isSpelling ? 'Listening… spell out loud (mic stays on)' : 'Listening… read the word out loud');
    safeStart();
    window.__micCtl = ctl;
    return ctl;
  };
</script>

<script type="module" src="/src/main.jsx"></script>
</body>
</html>
